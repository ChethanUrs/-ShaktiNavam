<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Rangoli - ShaktiNavam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;700&family=Teko:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #FFD700;
            --secondary-gold: #f7b600;
            --royal-purple: #4B0082;
            --deep-red: #8B0000;
            --royal-indigo: #240046;
            --dark-bg: #10002b;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Laila', serif;
            background-color: var(--dark-bg);
            color: #f0f0f0;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            font-family: 'Teko', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .navbar {
            background: rgba(16, 0, 43, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--primary-gold);
        }
        .nav-link {
            position: relative;
            color: #f0f0f0;
            transition: color 0.3s;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary-gold);
            transition: width 0.3s;
        }
        .nav-link:hover {
            color: var(--primary-gold);
            text-shadow: 0 0 5px var(--primary-gold);
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .section-container {
            padding-top: 8rem; 
            padding-bottom: 5rem;
        }
        .section-title {
            font-size: 4rem;
            color: var(--primary-gold);
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-gold);
        }
        .section-subtitle {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 3rem;
            color: #e0e0e0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Rangoli Styles */
        #rangoli-workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }
        @media (min-width: 1024px) {
            #rangoli-workspace {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        #rangoli-canvas {
            border: 4px solid var(--primary-gold);
            border-radius: 50%;
            cursor: crosshair;
            background-color: var(--dark-bg);
            box-shadow: 0 0 25px var(--primary-gold);
            touch-action: none;
        }
        #rangoli-canvas.fill-cursor { cursor: copy; }
        #rangoli-canvas.stamp-cursor { cursor: cell; }

        #controls {
            background-color: rgba(36, 0, 70, 0.5);
            border: 1px solid var(--royal-purple);
            border-radius: 15px;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
        }
        @media (min-width: 1024px) {
            #controls { max-width: 320px; }
        }
        
        .control-group { margin-bottom: 1.5rem; }
        .control-group h3 {
            font-size: 1.8rem;
            color: var(--secondary-gold);
            border-bottom: 1px solid var(--primary-gold);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        #color-palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 0.5rem;
        }
        .color-box {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-box:hover { transform: scale(1.1); }
        .color-box.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 10px #fff;
        }

        #pattern-palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 0.5rem;
        }
        .pattern-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--royal-purple);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--royal-indigo);
        }
        .pattern-box:hover, .pattern-box.active {
            border-color: var(--primary-gold);
            background-color: var(--royal-purple);
        }
        .pattern-box svg {
            width: 80%;
            height: 80%;
            stroke: var(--primary-gold);
            fill: none;
            stroke-width: 8;
        }

        label {
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 0.5rem;
            background-color: var(--royal-indigo);
            border: 1px solid var(--royal-purple);
            border-radius: 8px;
            color: #f0f0f0;
        }
        .tool-btn {
            background-color: var(--royal-purple);
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 0.75rem 1rem;
            font-size: 1.25rem;
            font-family: 'Teko', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .tool-btn:hover:not(:disabled), .tool-btn.active {
            background-color: var(--primary-gold);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--primary-gold);
        }
        .tool-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav id="navbar" class="navbar fixed top-0 left-0 right-0 z-50 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold text-yellow-400 font-['Teko']">ShaktiNavam🔱</a>
            <div class="hidden md:flex space-x-6">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="quiz.html" class="nav-link">Quiz</a>
            </div>
            <button id="menu-btn" class="md:hidden text-2xl text-white">☰</button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden p-4 space-y-2 bg-indigo-950">
            <a href="index.html" class="block nav-link">Home</a>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <section id="rangoli" class="section-container">
            <div class="w-full">
                <h2 class="section-title">Virtual Rangoli Canvas</h2>
                <p class="section-subtitle">Design a beautiful digital rangoli using our creative tools. Select your colors, patterns, and symmetry level!</p>
                
                <div id="rangoli-workspace">
                    <canvas id="rangoli-canvas"></canvas>
                    <div id="controls">
                        <div class="control-group">
                            <h3>Color Palette</h3>
                            <div id="color-palette"></div>
                        </div>
                        <div class="control-group">
                            <h3>Tools</h3>
                            <div class="grid grid-cols-2 gap-2">
                                <button class="tool-btn active" id="draw-btn">Brush</button>
                                <button class="tool-btn" id="fill-btn">Fill</button>
                                <button class="tool-btn" id="eraser-btn">Eraser</button>
                                <button class="tool-btn" id="undo-btn">Undo</button>
                            </div>
                            <button class="tool-btn mt-2" id="clear-btn">Clear Canvas</button>
                            <a class="tool-btn mt-2" id="download-btn" download="my-rangoli.png">Save Image</a>
                        </div>
                        <div class="control-group">
                            <h3>Patterns (Stamps)</h3>
                            <div id="pattern-palette"></div>
                        </div>
                        <div class="control-group">
                            <h3>Settings</h3>
                            <label for="brush-size">Size</label>
                            <input type="range" id="brush-size" min="5" max="100" value="20">
                            
                            <label for="symmetry" class="mt-4">Symmetry Points</label>
                            <select id="symmetry">
                                <option value="1">None</option>
                                <option value="4">4 Points</option>
                                <option value="6">6 Points</option>
                                <option value="8" selected>8 Points</option>
                                <option value="12">12 Points</option>
                                <option value="16">16 Points</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="bg-opacity-50 bg-royal-indigo text-center py-8 border-t-2 border-primary-gold/30">
        <p class="text-gray-400 text-sm">&copy; 2025 ShaktiNavam. All Rights Reserved.</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Navbar Logic ---
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));

        // --- Rangoli Canvas Logic ---
        const canvas = document.getElementById('rangoli-canvas');
        const ctx = canvas.getContext('2d');
        const colorPaletteContainer = document.getElementById('color-palette');
        const patternPalette = document.getElementById('pattern-palette');
        const brushSizeSlider = document.getElementById('brush-size');
        const symmetrySelect = document.getElementById('symmetry');
        
        const drawBtn = document.getElementById('draw-btn');
        const fillBtn = document.getElementById('fill-btn');
        const eraserBtn = document.getElementById('eraser-btn');
        const undoBtn = document.getElementById('undo-btn');
        const clearBtn = document.getElementById('clear-btn');
        const downloadBtn = document.getElementById('download-btn');

        const colors = [
            '#FFFFFF', '#FFD700', '#FFA500', '#FF4500', '#FF0000', 
            '#FF1493', '#4B0082', '#1E90FF', '#00FF00', '#228B22'
        ];
        
        const BG_COLOR = '#10002b';
        let currentTool = 'draw'; // draw, fill, eraser, pattern
        let selectedPattern = null;
        let currentColor = colors[1];
        let currentSize = 20;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let history = [];

        function setCanvasSize() {
            const size = Math.min(window.innerWidth * 0.9, 600);
            canvas.width = size;
            canvas.height = size;
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
        }
        setCanvasSize();

        // Populate Palette
        colors.forEach((color, i) => {
            const box = document.createElement('div');
            box.className = 'color-box' + (i === 1 ? ' active' : '');
            box.style.backgroundColor = color;
            box.onclick = () => {
                currentColor = color;
                document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
                box.classList.add('active');
            };
            colorPaletteContainer.appendChild(box);
        });

        // Patterns Logic
        const patterns = {
            lotus: (ctx, x, y, size) => {
                ctx.save(); ctx.translate(x, y); ctx.scale(size/80, size/80);
                ctx.beginPath();
                ctx.moveTo(0, -20);
                ctx.quadraticCurveTo(-15, -40, -5, -10);
                ctx.quadraticCurveTo(-25, -20, -10, 5);
                ctx.quadraticCurveTo(-20, 25, 0, 10);
                ctx.quadraticCurveTo(20, 25, 10, 5);
                ctx.quadraticCurveTo(25, -20, 5, -10);
                ctx.quadraticCurveTo(15, -40, 0, -20);
                ctx.fill(); ctx.restore();
            },
            star: (ctx, x, y, size) => {
                ctx.save(); ctx.translate(x, y); ctx.scale(size/100, size/100);
                ctx.beginPath();
                for(let i=0; i<5; i++){
                    ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*50, Math.sin((18+i*72)/180*Math.PI)*50);
                    ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*25, Math.sin((54+i*72)/180*Math.PI)*25);
                }
                ctx.closePath(); ctx.fill(); ctx.restore();
            },
            circle: (ctx, x, y, size) => {
                ctx.beginPath(); ctx.arc(x, y, size/2, 0, Math.PI*2); ctx.fill();
            }
        };

        const patternSVGs = {
            lotus: '<path d="M50 10 Q35 30 45 60 Q25 50 40 70 Q30 90 50 80 Q70 90 60 70 Q75 50 55 60 Q65 30 50 10Z"/>',
            star: '<path d="M50 5 L61 40 L98 40 L68 62 L79 96 L50 75 L21 96 L32 62 L2 40 L39 40 Z"/>',
            circle: '<circle cx="50" cy="50" r="40"/>'
        };

        Object.keys(patterns).forEach(key => {
            const box = document.createElement('div');
            box.className = 'pattern-box';
            box.innerHTML = `<svg viewBox="0 0 100 100">${patternSVGs[key]}</svg>`;
            box.onclick = () => {
                selectedPattern = key;
                setCurrentTool('pattern');
                document.querySelectorAll('.pattern-box').forEach(b => b.classList.remove('active'));
                box.classList.add('active');
            };
            patternPalette.appendChild(box);
        });

        function setCurrentTool(tool) {
            currentTool = tool;
            [drawBtn, fillBtn, eraserBtn].forEach(b => b.classList.remove('active'));
            if(tool === 'draw') drawBtn.classList.add('active');
            if(tool === 'fill') fillBtn.classList.add('active');
            if(tool === 'eraser') eraserBtn.classList.add('active');
            
            canvas.className = '';
            if(tool === 'fill') canvas.classList.add('fill-cursor');
            if(tool === 'pattern') canvas.classList.add('stamp-cursor');
            if(tool !== 'pattern') {
                document.querySelectorAll('.pattern-box').forEach(b => b.classList.remove('active'));
            }
        }

        drawBtn.onclick = () => setCurrentTool('draw');
        fillBtn.onclick = () => setCurrentTool('fill');
        eraserBtn.onclick = () => setCurrentTool('eraser');

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x, y };
        }

        function drawWithSymmetry(pos, isFirstPoint) {
            const symmetry = parseInt(symmetrySelect.value);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.strokeStyle = currentTool === 'eraser' ? BG_COLOR : currentColor;
            ctx.lineWidth = currentSize / 4;
            ctx.lineCap = 'round';

            for (let i = 0; i < symmetry; i++) {
                const angle = (i * 2 * Math.PI) / symmetry;
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle);
                
                ctx.beginPath();
                ctx.moveTo(lastX - centerX, lastY - centerY);
                ctx.lineTo(pos.x - centerX, pos.y - centerY);
                ctx.stroke();
                ctx.restore();
            }
        }

        canvas.onmousedown = canvas.ontouchstart = (e) => {
            if(currentTool === 'fill' || currentTool === 'pattern') return;
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
        };

        window.onmousemove = window.ontouchmove = (e) => {
            if(!isDrawing) return;
            const pos = getPos(e);
            drawWithSymmetry(pos);
            lastX = pos.x; lastY = pos.y;
        };

        window.onmouseup = window.ontouchend = () => {
            if(isDrawing) { isDrawing = false; saveState(); }
        };

        canvas.onclick = (e) => {
            const pos = getPos(e);
            if(currentTool === 'fill') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y), currentColor);
            } else if(currentTool === 'pattern' && selectedPattern) {
                const symmetry = parseInt(symmetrySelect.value);
                const centerX = canvas.width/2, centerY = canvas.height/2;
                ctx.fillStyle = currentColor;
                for(let i=0; i<symmetry; i++){
                    const angle = (i * 2 * Math.PI) / symmetry;
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    patterns[selectedPattern](ctx, pos.x - centerX, pos.y - centerY, currentSize);
                    ctx.restore();
                }
                saveState();
            }
        };

        function saveState() {
            history.push(canvas.toDataURL());
            if(history.length > 20) history.shift();
        }

        undoBtn.onclick = () => {
            if(history.length > 1) {
                history.pop();
                const img = new Image();
                img.src = history[history.length - 1];
                img.onload = () => {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    ctx.drawImage(img,0,0);
                };
            }
        };

        clearBtn.onclick = () => {
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0,0,canvas.width,canvas.height);
            saveState();
        };

        brushSizeSlider.oninput = (e) => currentSize = e.target.value;

        // Simple Flood Fill
        function floodFill(x, y, color) {
            const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
            const data = imgData.data;
            const target = getPixel(x, y);
            const replacement = hexToRgb(color);
            if(target.r === replacement.r && target.g === replacement.g && target.b === replacement.b) return;

            const stack = [[x, y]];
            while(stack.length > 0) {
                const [curX, curY] = stack.pop();
                const curTarget = getPixel(curX, curY);
                if(curTarget.r === target.r && curTarget.g === target.g && curTarget.b === target.b) {
                    setPixel(curX, curY, replacement);
                    if(curX > 0) stack.push([curX-1, curY]);
                    if(curX < canvas.width-1) stack.push([curX+1, curY]);
                    if(curY > 0) stack.push([curX, curY-1]);
                    if(curY < canvas.height-1) stack.push([curX, curY+1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
            saveState();

            function getPixel(px, py) {
                const i = (py * canvas.width + px) * 4;
                return { r: data[i], g: data[i+1], b: data[i+2] };
            }
            function setPixel(px, py, c) {
                const i = (py * canvas.width + px) * 4;
                data[i] = c.r; data[i+1] = c.g; data[i+2] = c.b; data[i+3] = 255;
            }
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return {r, g, b};
        }

        downloadBtn.onclick = () => {
            downloadBtn.href = canvas.toDataURL();
        };
    });
    </script>
</body>
</html>
